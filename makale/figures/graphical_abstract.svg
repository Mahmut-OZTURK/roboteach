  <text x="961" y="128" fill="#0f2942" font-size="12" font-weight="bold">• Genel (n=180): %87,22 (157/180)</text>
  <text x="971" y="145" fill="#475569" font-size="11">[95% GA: %81,56–%91,33; p = 2,24e-10]</text>
  <text x="961" y="168" fill="#0f766e" font-size="12" font-weight="bold">• T4–T6 Kısıt-Yoğun: %92,22 (83/90)</text>
  <text x="971" y="185" fill="#475569" font-size="11">T4 %80,0 | T5 %96,7 | T6 %100,0</text>
  <text x="961" y="209" fill="#1e293b" font-size="11.5">• Bileşen çıkarmada en kritik katman:</text>
  <text x="971" y="225" fill="#dc2626" font-size="11.5" font-weight="bold">Ontoloji (-47,78 yp) &amp; 3B (-21,11 yp)</text>
  <text x="961" y="248" fill="#1e293b" font-size="11.5">• Fiziksel/Sensör DR (n=180):</text>
  <text x="971" y="264" fill="#0f2942" font-size="11.5" font-weight="bold">%81,67 vs Fair CaP %54,44 (p=1,38e-9)</text>

