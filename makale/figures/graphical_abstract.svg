  <text x="340" y="190" fill="#1e293b" font-size="11.5">• 4 RGB-D ışın-telafili nokta bulutu Φ_3D:</text>
  <text x="350" y="206" fill="#1d4ed8" font-size="11.5" font-weight="bold">23,85 → 2,63 mm (9,07× iyileşme)</text>
