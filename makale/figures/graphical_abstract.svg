  <text x="620" y="34" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">240 Hz Simüle Temas Fiziğinde Kapalı Döngü Nöro-Sembolik 7-DOF Manipülasyon (1.800+ Deneme)</text>
  <text x="620" y="51" text-anchor="middle" fill="#cbd5e1" font-size="11">Yapay sabit-bağ olmadan Franka Panda temas simülasyonu • Çapraz-aile VLM hakem • Nöro-sembolik deneyim belleği</text>

  <!-- Stage 1 -->
  <rect x="28" y="76" width="265" height="218" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  <rect x="28" y="76" width="265" height="30" fill="#dc2626" rx="6"/>
  <rect x="28" y="92" width="265" height="14" fill="#dc2626"/>
  <text x="160" y="96" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">1. Açık Döngü ve Sözel Çöküş</text>
  <text x="42" y="128" fill="#1e293b" font-size="11.5">• Sıfır-örnek gpt-6-luna: %37,78 (68/180)</text>
  <text x="42" y="149" fill="#1e293b" font-size="11.5">• Tek tepe kamera: 23,85 mm RMSE</text>
  <text x="42" y="170" fill="#1e293b" font-size="11.5">• Örtülü hedef kaybı: %26,7 (nominal)</text>
  <text x="42" y="191" fill="#1e293b" font-size="11.5">• Sözel yansıma %58,89 Fair CaP’tan</text>
  <text x="52" y="207" fill="#991b1b" font-size="11.5" font-weight="bold">%53,89’a geriler (-5,00 yp)</text>
  <text x="42" y="232" fill="#7f1d1d" font-size="11">• Eş anlamlı önbellek isabeti: %0,0 (0/6)</text>
  <text x="42" y="253" fill="#7f1d1d" font-size="11">• İç kap (T4) yalnızca %33,3–%36,7</text>

  <line x1="293" y1="185" x2="323" y2="185" stroke="#0f2942" stroke-width="2.2" marker-end="url(#arr)"/>

