  <text x="658" y="186" fill="#0f766e" font-size="11.5" font-weight="bold">p50 = 1,59 s (%53,9 daha hızlı) | κ = 0,608</text>
  <text x="648" y="209" fill="#1e293b" font-size="11.5">• Dual Bellek: Kinematik önsel Δψ + ≤6</text>
  <text x="658" y="225" fill="#1e293b" font-size="11.5">tekilleştirilmiş sembolik değişmez R_sym</text>
  <text x="648" y="248" fill="#0f766e" font-size="11" font-weight="bold">• Çıktı token düşüşü: %29,1 (87,5K→62,0K)</text>

  <line x1="914" y1="185" x2="944" y2="185" stroke="#0f2942" stroke-width="2.2" marker-end="url(#arr)"/>

