  <text x="153" y="400" text-anchor="middle" fill="#334155" font-size="10.5">Overall Success (157/180)</text>
  <text x="153" y="413" text-anchor="middle" fill="#64748b" font-size="9.5">vs Fair CaP 58.89% • p = 2.24e-10</text>

  <rect x="278" y="354" width="218" height="64" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" rx="5"/>
