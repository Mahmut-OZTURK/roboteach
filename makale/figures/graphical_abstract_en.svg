<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 460" width="1240" height="460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2942"/>
    </marker>
  </defs>

  <rect width="1240" height="460" fill="#f8fafc" rx="8"/>
  <rect x="10" y="10" width="1220" height="440" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>

  <!-- Header -->
  <rect x="10" y="10" width="1220" height="48" fill="#0f2942" rx="6"/>
  <rect x="10" y="34" width="1220" height="24" fill="#0f2942"/>
  <text x="620" y="34" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Closed-Loop Neuro-Symbolic 7-DOF Manipulation in 240 Hz Simulated Contact Physics (1,800+ Rollouts)</text>
  <text x="620" y="51" text-anchor="middle" fill="#cbd5e1" font-size="11">Zero-weld Franka Panda frictional contact simulation • Cross-family multimodal VLM critic • Dual-channel experience memory</text>

  <!-- Stage 1 -->
  <rect x="28" y="76" width="265" height="218" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="6"/>
  <rect x="28" y="76" width="265" height="30" fill="#dc2626" rx="6"/>
  <rect x="28" y="92" width="265" height="14" fill="#dc2626"/>
  <text x="160" y="96" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">1. Open-Loop &amp; Verbal Failure</text>
  <text x="42" y="128" fill="#1e293b" font-size="11.5">• Zero-shot gpt-6-luna: 37.78% (68/180)</text>
  <text x="42" y="149" fill="#1e293b" font-size="11.5">• Single overhead view: 23.85 mm RMSE</text>
  <text x="42" y="170" fill="#1e293b" font-size="11.5">• Occluded miss rate: 26.7% (nominal)</text>
  <text x="42" y="191" fill="#1e293b" font-size="11.5">• Unstructured verbal reflexion drops</text>
  <text x="52" y="207" fill="#991b1b" font-size="11.5" font-weight="bold">58.89% Fair CaP → 53.89% (-5.00 pp)</text>
  <text x="42" y="232" fill="#7f1d1d" font-size="11">• Synonym cache hit rate: 0.0% (0/6)</text>
  <text x="42" y="253" fill="#7f1d1d" font-size="11">• Cavity packing (T4): 33.3%–36.7%</text>

  <line x1="293" y1="185" x2="323" y2="185" stroke="#0f2942" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="326" y="76" width="275" height="218" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <rect x="326" y="76" width="275" height="30" fill="#2563eb" rx="6"/>
  <rect x="326" y="92" width="275" height="14" fill="#2563eb"/>
  <text x="463" y="96" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">2. Task Ontology &amp; 4-View 3D</text>
  <text x="340" y="128" fill="#1e293b" font-size="11.5">• Ontology O_task maps 6 task families</text>
  <text x="350" y="144" fill="#1e293b" font-size="11.5">deterministically (100.0% synonym hit)</text>
  <text x="340" y="167" fill="#1e293b" font-size="11.5">• Precondition sub-goal splits for T5</text>
  <text x="340" y="190" fill="#1e293b" font-size="11.5">• 4-view ray-compensated cloud Φ_3D:</text>
  <text x="350" y="206" fill="#1d4ed8" font-size="11.5" font-weight="bold">23.85 → 2.63 mm RMSE (9.07× gain)</text>
  <text x="340" y="229" fill="#1e293b" font-size="11.5">• Sensor perturbation: 3.99 mm (6.05×)</text>
  <text x="340" y="252" fill="#1d4ed8" font-size="11.5" font-weight="bold">• Occluded recall: 100.0% (60/60)</text>

  <line x1="601" y1="185" x2="631" y2="185" stroke="#0f2942" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="634" y="76" width="280" height="218" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5" rx="6"/>
  <rect x="634" y="76" width="280" height="30" fill="#0f766e" rx="6"/>
  <rect x="634" y="92" width="280" height="14" fill="#0f766e"/>
  <text x="774" y="96" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">3. 240 Hz PD &amp; Neuro-Symbolic Memory</text>
  <text x="648" y="128" fill="#1e293b" font-size="11.5">• AST Guard + quintic min-jerk 240 Hz PD</text>
  <text x="648" y="149" fill="#1e293b" font-size="11.5">• Cone-friction grasping (75 N, μ=2.2)</text>
  <text x="648" y="170" fill="#1e293b" font-size="11.5">• Decoupled VLM critic (gpt-4.1):</text>
  <text x="658" y="186" fill="#0f766e" font-size="11.5" font-weight="bold">p50 = 1.59 s (53.9% faster) | κ = 0.608</text>
  <text x="648" y="209" fill="#1e293b" font-size="11.5">• Dual Memory: Calibrated priors Δψ + ≤6</text>
  <text x="658" y="225" fill="#1e293b" font-size="11.5">deduplicated symbolic invariants R_sym</text>
  <text x="648" y="248" fill="#0f766e" font-size="11" font-weight="bold">• Output token savings: 29.1% (87.5K→62.0K)</text>

  <line x1="914" y1="185" x2="944" y2="185" stroke="#0f2942" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <rect x="947" y="76" width="265" height="218" fill="#f8fafc" stroke="#0f2942" stroke-width="1.8" rx="6"/>
  <rect x="947" y="76" width="265" height="30" fill="#0f2942" rx="6"/>
  <rect x="947" y="92" width="265" height="14" fill="#0f2942"/>
  <text x="1079" y="96" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="bold">4. Large-Scale Verification</text>
  <text x="961" y="128" fill="#0f2942" font-size="12" font-weight="bold">• Overall (n=180): 87.22% (157/180)</text>
  <text x="971" y="145" fill="#475569" font-size="11">[95% CI: 81.56–91.33%; p = 2.24e-10]</text>
  <text x="961" y="168" fill="#0f766e" font-size="12" font-weight="bold">• T4–T6 Constrained: 92.22% (83/90)</text>
  <text x="971" y="185" fill="#475569" font-size="11">T4 80.0% | T5 96.7% | T6 100.0%</text>
  <text x="961" y="209" fill="#1e293b" font-size="11.5">• Critical leave-one-out drops:</text>
  <text x="971" y="225" fill="#dc2626" font-size="11.5" font-weight="bold">Ontology (-47.78 pp) &amp; 3D (-21.11 pp)</text>
  <text x="961" y="248" fill="#1e293b" font-size="11.5">• Physics/RGB-D DR (n=180):</text>
  <text x="971" y="264" fill="#0f2942" font-size="11.5" font-weight="bold">81.67% vs Fair CaP 54.44% (p=1.38e-9)</text>

  <!-- Bottom KPI Bar -->
  <rect x="28" y="318" width="1184" height="114" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="6"/>
  <text x="620" y="340" text-anchor="middle" fill="#0f2942" font-size="12.5" font-weight="bold">HEADLINE SIMULATED BENCHMARK RESULTS (1,800 LIVE ROLLOUTS + N=120 PAIRED VLM JUDGE AUDIT)</text>

  <rect x="44" y="354" width="218" height="64" fill="#ffffff" stroke="#0f766e" stroke-width="1.3" rx="5"/>
