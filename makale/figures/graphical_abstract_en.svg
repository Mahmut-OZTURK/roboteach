  <text x="387" y="400" text-anchor="middle" fill="#334155" font-size="10.5">T4–T6 Constrained (83/90)</text>
  <text x="387" y="413" text-anchor="middle" fill="#64748b" font-size="9.5">T5 96.67% • T6 100.00%</text>

  <rect x="512" y="354" width="218" height="64" fill="#ffffff" stroke="#0f2942" stroke-width="1.3" rx="5"/>
  <text x="621" y="381" text-anchor="middle" fill="#0f2942" font-size="20" font-weight="bold">2.63 mm</text>
  <text x="621" y="400" text-anchor="middle" fill="#334155" font-size="10.5">3D Pose RMSE (9.07×)</text>
  <text x="621" y="413" text-anchor="middle" fill="#64748b" font-size="9.5">100.0% occluded recall (n=60)</text>

  <rect x="746" y="354" width="218" height="64" fill="#ffffff" stroke="#d97706" stroke-width="1.3" rx="5"/>
  <text x="855" y="381" text-anchor="middle" fill="#b45309" font-size="20" font-weight="bold">81.67%</text>
  <text x="855" y="400" text-anchor="middle" fill="#334155" font-size="10.5">Domain Randomization (147/180)</text>
  <text x="855" y="413" text-anchor="middle" fill="#64748b" font-size="9.5">vs Fair CaP 54.44% • +27.23 pp</text>

  <rect x="980" y="354" width="216" height="64" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3" rx="5"/>
  <text x="1088" y="381" text-anchor="middle" fill="#6d28d9" font-size="20" font-weight="bold">κ = 0.608</text>
  <text x="1088" y="400" text-anchor="middle" fill="#334155" font-size="10.5">N=120 Cross-Family Critic</text>
  <text x="1088" y="413" text-anchor="middle" fill="#64748b" font-size="9.5">p50=1.59 s (53.9% faster)</text>
